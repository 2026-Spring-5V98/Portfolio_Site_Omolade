services:
  - type: web
    name: portfolio
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py ensure_superuser &&
      python manage.py load_initial_data &&
      python manage.py sync_media_env
    startCommand: gunicorn portfolio_site.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: portfolio_site.settings
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      # Set these manually in the Render dashboard (Environment tab)
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # After uploading headshot/resume via admin, copy the Cloudinary path
      # from the admin "Currently:" link and paste it here.
      - key: PROFILE_HEADSHOT
        sync: false
      - key: PROFILE_RESUME_PDF
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GCAL_CREDENTIALS_JSON
        sync: false
      - key: GCAL_CALENDAR_ID
        sync: false
      - key: GCAL_TIMEZONE
        value: Africa/Lagos

databases:
  - name: portfolio-db
    plan: free
